name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://lusotop-api.onrender.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 826958713069-61de115nojdp0nbqfllsh5v06mrgauql.apps.googleusercontent.com

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Avisa o Bing/Yandex (IndexNow) de que o site foi atualizado. Chave publica em
      # /1c2e50b61c8fe5c09678c726b67de985.txt. Nao falha o deploy se o ping falhar.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -sS -m 30 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "lusotop.online",
              "key": "1c2e50b61c8fe5c09678c726b67de985",
              "keyLocation": "https://lusotop.online/1c2e50b61c8fe5c09678c726b67de985.txt",
              "urlList": [
                "https://lusotop.online",
                "https://lusotop.online/paises/ao",
                "https://lusotop.online/paises/br",
                "https://lusotop.online/paises/cv",
                "https://lusotop.online/paises/gw",
                "https://lusotop.online/paises/mz",
                "https://lusotop.online/paises/pt",
                "https://lusotop.online/paises/st"
              ]
            }' || true
