spring:
  application:
    name: lusotop-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lusotop}
    username: ${DATABASE_USERNAME:lusotop}
    password: ${DATABASE_PASSWORD:lusotop}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  demo-mode: ${DEMO_MODE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:lusotop-local-dev-secret-change-me-in-production-please-32chars-min}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
