spring:
  application:
    name: lusotop-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lusotop}
    username: ${DATABASE_USERNAME:lusotop}
    password: ${DATABASE_PASSWORD:lusotop}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  demo-mode: ${DEMO_MODE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Sem valor por omissao de proposito: este repositorio e publico, por isso qualquer valor
    # fixo aqui seria visivel a qualquer pessoa. Se JWT_SECRET nao estiver definido, a app falha
    # ao arrancar em vez de assinar/aceitar tokens com uma chave conhecida publicamente.
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/recarga/sucesso?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/recarga/cancelada}
  dingconnect:
    api-key: ${DINGCONNECT_API_KEY:}
    base-url: ${DINGCONNECT_BASE_URL:https://api.dingconnect.com}
    proxy-url: ${DINGCONNECT_PROXY_URL:}
