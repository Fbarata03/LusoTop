services:
  postgres:
    image: postgres:16-alpine
    container_name: lusotop-postgres
    environment:
      POSTGRES_DB: lusotop
      POSTGRES_USER: lusotop
      POSTGRES_PASSWORD: lusotop
    ports:
      - "5432:5432"
    volumes:
      - lusotop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lusotop -d lusotop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lusotop_postgres_data:
